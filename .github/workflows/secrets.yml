name: Analyse de secrets

# Aucun identifiant ne doit être versionné (règles dans .gitleaks.toml). Seuls les commits
# nouveaux de la PR ou du push sont analysés : l'historique ancien n'est pas rescanné.
on:
  pull_request:
  push:
    branches: ["20.0"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar xzf gitleaks.tar.gz gitleaks
          if [ "$EVENT" = pull_request ]; then
            RANGE="$BASE..$HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            RANGE="$HEAD~1..$HEAD"
          else
            RANGE="$BEFORE..$HEAD"
          fi
          ./gitleaks git --config .gitleaks.toml --log-opts="$RANGE" --redact --no-banner --exit-code 1 .
