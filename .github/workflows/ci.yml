name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une poussée qui en remplace une autre annule la première : rien ne sert de
# faire tourner deux fois la même suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Odoo avance vite et casse des choses : la CI épingle le commit sur lequel
  # les tests ont réellement été validés, plutôt que de suivre master.
  # Pour avancer : remplacer par le commit voulu, relancer, corriger, repousser.
  ODOO_COMMIT: 9c2e8fb1b09c0fbdc01d773a33663a7eaf0522f1
  MODULES: asterisk_ari,mailcow_admin,voipms_sms,wazo_phone,wazo_server

jobs:
  qualite:
    name: Qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Lint — erreurs réelles seulement
        run: |
          python -m pip install --quiet ruff==0.16.9
          # Les conventions du dépôt sont dans ruff.toml, avec leur raison :
          # l'apostrophe française, le formatage en « % », et surtout les
          # imports des __init__.py — qui sont des déclarations, pas des
          # imports morts, et dont l'ordre n'est pas alphabétique.
          # Sans ce fichier, le catalogue complet relèverait 373 trouvailles
          # dont l'immense majorité sont des faux positifs.
          # « poc » est exclu : il n'est pas versionné et porte des secrets.
          ruff check . --exclude poc

      # Le crochet qui garde les poussées doit être gardé : ce test clone le
      # dépôt, y pose le crochet, pose une faute de chaque sorte et exige le
      # refus. Sans lui, un crochet qui cesse de bloquer ne se voit nulle part
      # avant que le coureur ne découvre le rouge.
      - name: Le crochet refuse ce qu'il doit refuser
        run: python3 tools/test_crochet.py

      # Le script de courriel touche a des identifiants : ses refus locaux
      # doivent tenir. Aucun reseau, aucun secret — les ecritures, elles, ne se
      # verifient que sur le domaine jetable.
      - name: Les garde-fous du cycle de mot de passe tiennent
        run: bash tools/test_app_password.sh

      - name: Syntaxe Python des fichiers versionnés
        run: |
          # La liste vient de git : ce qui n'est pas versionné n'est pas
          # vérifié, et notamment pas les scripts locaux du dossier « poc ».
          python -m compileall -q $(git ls-files '*.py')

      - name: XML bien formé
        run: python .github/scripts/verifier_les_xml.py

      - name: Tests JS
        run: node --test '*/static/tests/*.test.js'

      - name: Restes du dépôt
        run: |
          # Version hors série, modèle sans règle d'accès, import JavaScript
          # mort : trois défauts qui passent la relecture et ne se voient
          # qu'à l'exécution.
          python3 tools/verifier_les_restes.py

      - name: Verrou Odoo
        run: |
          # L'arbre cloné ici doit être celui que le verrou déclare validé —
          # sinon la CI éprouve une révision que personne n'a éprouvée.
          python3 tools/odoo_lock.py check

  odoo:
    name: Tests Odoo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Bibliothèques système d'Odoo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libldap2-dev libsasl2-dev libpq-dev libxml2-dev libxslt1-dev \
            libjpeg-dev zlib1g-dev libffi-dev

      - name: Odoo au commit épinglé
        run: |
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/odoo/odoo.git odoo
          git -C odoo checkout --quiet $ODOO_COMMIT

      - name: Restes du dépôt, verrou compris
        # Ici l'arbre d'Odoo est là : les imports JavaScript sont réellement
        # résolus et le verrou est comparé à la révision qui vient d'être
        # clonée. Dans le travail « Qualité », les mêmes contrôles tournent
        # sans l'arbre et le disent au lieu de crier au loup.
        run: |
          python3 tools/verifier_les_restes.py
          python3 tools/odoo_lock.py check

      - name: Dépendances Python d'Odoo
        # websocket-client pilote Chrome pour les tests HttpCase : sans lui,
        # Odoo les saute sans echouer, et le test des tableaux de bord de
        # mailcow_admin passerait au vert sans avoir rien ouvert.
        run: python -m pip install --quiet -r odoo/requirements.txt websocket-client

      - name: Réchauffer Chrome
        # Odoo n'attend que 10 s le port devtools de Chrome, puis SAUTE le test
        # sans echouer. Sur le runner, le tout premier lancement de Chrome
        # depasse ce delai (constate le 2026-09-26) ; un lancement a vide
        # avant les tests rend le suivant assez rapide.
        run: google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom about:blank > /dev/null

      - name: Tests des cinq modules, sur une base neuve
        # Pas de --no-http : les tests HttpCase ouvrent les ecrans dans Chrome
        # et ont besoin du serveur web.
        run: |
          set -o pipefail
          python odoo/odoo-bin \
            --addons-path=odoo/addons,. \
            --db_host=127.0.0.1 --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            --database=hermes_ci \
            --init=$MODULES \
            --test-enable \
            --test-tags=/asterisk_ari,/mailcow_admin,/voipms_sms,/wazo_phone,/wazo_server \
            --stop-after-init --max-cron-threads=0 --log-level=test \
            2>&1 | tee odoo-tests.log
          # Un test navigateur saute n'est pas un test reussi : Odoo le compte
          # comme « skipped » et le resultat resterait vert sans rien avoir ouvert.
          if grep -E "skipped .*: (Failed to detect chrome devtools|websocket-client module is not installed|Chrome executable not found)" odoo-tests.log; then
            echo "::error::Un test navigateur a ete saute : voir ci-dessus."
            exit 1
          fi
